<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Hesabınız kullanıma açıldı — Neo</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,"Segoe UI",sans-serif;color:#17213a;background:#eef1fb}main{width:min(94vw,500px);padding:42px 34px;text-align:center;border-radius:30px;background:rgba(255,255,255,.8);box-shadow:0 24px 80px rgba(72,83,130,.16)}.logo{width:64px;height:64px;margin:0 auto 22px;border-radius:21px;overflow:hidden;background:#31445e}.logo img{width:100%;height:100%;object-fit:cover}h1{margin:0;font-size:26px;letter-spacing:-.05em}p{margin:13px 0 24px;color:#7b86a1;line-height:1.6;font-size:14px}a{display:inline-block;padding:12px 18px;border-radius:13px;color:#fff;background:#202b49;text-decoration:none;font-weight:800;font-size:13px}@media(prefers-color-scheme:dark){body{color:#edf1ff;background:#080b14}main{background:rgba(20,25,42,.86)}p{color:#9ba8c3}a{background:#edf1ff;color:#101525}}
      /* Resmi, sade hesap durumu teması */
      body{background:#f4f6f8}main{border:1px solid #dfe4ea;border-radius:16px;background:#fff;box-shadow:0 10px 30px rgba(31,45,61,.08)}.logo{border-radius:14px;box-shadow:none}a{border-radius:9px;background:#34465b}
      @media(prefers-color-scheme:dark){body{background:#151a20}main{border-color:#36414d;background:#202731;box-shadow:0 10px 30px rgba(0,0,0,.25)}p{color:#9ba8c3}a{background:#60758c}}
    </style>
</head>
<body><main><div class="logo"><img src="{{ url_for('static', filename='neo-logo.webp') }}" alt="Neo"></div><h1>Hesabınız kullanıma açıldı ({{ user_name }})</h1><p>Tekrar Neo'dasınız.</p><a href="/">Neo'ya devam et</a></main></body>
</html>
