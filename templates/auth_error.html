<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo - Giriş Hatası</title>
    <link rel="icon" href="{{ url_for('static', filename='neo-logo.webp') }}" type="image/webp">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #fff;
            color: #111;
        }
        main {
            width: min(100%, 440px);
            text-align: center;
            padding: 40px 28px;
            border: 1px solid #e8e8e8;
            border-radius: 20px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, .08);
        }
        h1 { margin: 0 0 12px; font-size: 24px; }
        p { margin: 0 0 26px; color: #666; line-height: 1.5; }
        a {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 24px;
            background: #111;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
        @media (prefers-color-scheme: dark) {
            body { background:#080b14; color:#edf1ff; }
            main { border-color:rgba(255,255,255,.09); background:#14192a; box-shadow:0 20px 60px rgba(0,0,0,.4); }
            p { color:#9ba8c3; } a { background:#edf1ff; color:#101525; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Giriş tamamlanamadı</h1>
        <p>Apple veya Replit hesabıyla giriş sırasında bir sorun oluştu. Lütfen tekrar deneyin.</p>
        <a href="{{ url_for('home') }}">Giriş sayfasına dön</a>
    </main>
</body>
</html>
