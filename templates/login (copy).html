<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo — Sana iyi gelen asistan</title>
    <meta name="theme-color" content="#34465b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Neo">
    <link rel="manifest" href="{{ url_for('static', filename='neo-manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='neo-logo.webp') }}">
    <link rel="preload" href="{{ url_for('static', filename='neo-logo.webp') }}" as="image" type="image/webp">
    <link rel="icon" href="{{ url_for('static', filename='neo-logo.webp') }}" type="image/webp">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Inter, "Segoe UI", sans-serif;
            background: #eef1fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #17213a;
        }
        body:before, body:after { content:""; position:fixed; z-index:-1; border-radius:50%; filter:blur(4px); opacity:.7; animation: drift 12s ease-in-out infinite alternate; }
        body:before { width:440px; height:440px; left:-140px; top:-150px; background:#d9ceff; }
        body:after { width:380px; height:380px; right:-130px; bottom:-140px; background:#bceff4; animation-delay:-5s; }
        .login-container {
            width:min(92vw, 440px);
            text-align: center;
            padding: 48px 40px 38px;
            border:1px solid rgba(255,255,255,.9);
            border-radius:32px;
            background:rgba(255,255,255,.72);
            box-shadow:0 24px 80px rgba(72,83,130,.16);
            backdrop-filter:blur(24px);
            animation: rise .75s cubic-bezier(.2,.8,.2,1);
        }
        .logo {
            width:76px; height:76px; display:grid; place-items:center; margin:0 auto 22px;
            border-radius:25px; overflow:hidden; background:#31445e;
            box-shadow:0 16px 32px rgba(117,87,245,.28);
            animation: float 4s ease-in-out infinite;
        }
        .logo img { width:100%; height:100%; object-fit:cover; }
        .subtitle {
            color: #6f7b98;
            margin: 10px auto 28px;
            font-size: .98em;
            line-height:1.5;
        }
        .login-btn {
            display:flex; align-items:center; justify-content:center; gap:10px;
            padding:15px 22px;
            background:linear-gradient(110deg,#7658f6,#4acfdc);
            color: white;
            text-decoration: none;
            border-radius:17px;
            font-size:1em; font-weight:800;
            transition:.25s;
            box-shadow:0 10px 22px rgba(117,87,245,.22);
        }
        .login-btn:hover {
            transform:translateY(-3px);
            box-shadow:0 15px 28px rgba(117,87,245,.3);
        }
        .auth-form { margin-top:18px; text-align:left; }
        .auth-form label { display:block; margin:12px 0 6px; color:#62708d; font-size:12px; font-weight:800; }
        .auth-form input { width:100%; padding:13px 14px; border:1px solid rgba(130,145,190,.24); border-radius:13px; outline:0; color:#17213a; background:rgba(255,255,255,.72); font:inherit; }
        .auth-form input:focus { border-color:#7658f6; box-shadow:0 0 0 4px rgba(118,88,246,.1); }
        .auth-submit { width:100%; margin-top:16px; padding:13px; border:0; border-radius:14px; color:#fff; cursor:pointer; font:inherit; font-weight:800; background:#202b49; }
        .auth-switch { margin-top:16px; color:#7d89a2; text-align:center; font-size:12px; }
        .auth-switch button { border:0; padding:0; color:#6754dc; cursor:pointer; background:transparent; font:inherit; font-weight:800; }
        .auth-panel { display:none; }
        .auth-panel.active { display:block; }
        .error { margin-top:14px; padding:11px 12px; border-radius:12px; color:#a83f58; background:#fff0f3; text-align:left; font-size:12px; }
        .providers {
            display:flex; justify-content:center; gap:8px; flex-wrap:wrap;
            margin-top:20px; color:#8993aa; font-size:.8em;
        }
        .providers span { padding:7px 10px; border:1px solid rgba(130,145,190,.18); border-radius:20px; background:rgba(255,255,255,.45); }
        .footer { margin-top:28px; color:#9ca6bc; font-size:.76em; }
        .note { margin-top:14px; color:#8792ab; font-size:.74em; line-height:1.45; }
         @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
         /* Resmi, sade giriş teması */
         body:before, body:after { display:none; }
         body { background:#f4f6f8; }
         .login-container { border-color:#dfe4ea; border-radius:16px; background:#fff; box-shadow:0 10px 30px rgba(31,45,61,.08); backdrop-filter:none; }
         .logo { background:#34465b; box-shadow:none; animation:none; border-radius:14px; }
         .login-btn { background:#34465b; border-radius:10px; box-shadow:none; }
         .login-btn:hover { transform:none; box-shadow:none; background:#26384c; }
         .auth-form input { background:#f8f9fb; border-color:#d5dce4; }
         .auth-form input:focus { border-color:#8795a5; box-shadow:0 0 0 3px rgba(52,70,91,.1); }
         .auth-switch button { color:#34465b; }
         .providers span { background:#f8f9fb; border-color:#dfe4ea; }
         @media (prefers-color-scheme: dark) {
             body { background:#151a20; }
             .login-container { background:#202731; border-color:#36414d; box-shadow:0 10px 30px rgba(0,0,0,.25); }
             .login-btn { background:#60758c; }
             .auth-form input { color:#edf1f5; background:#181e25; border-color:#3b4754; }
             .providers span { background:#2a333e; border-color:#3b4754; }
         }
        @keyframes float { 0%,100% { transform:translateY(0) rotate(-2deg); } 50% { transform:translateY(-7px) rotate(2deg); } }
        @keyframes drift { from { transform:translate(0,0) scale(1); } to { transform:translate(30px,24px) scale(1.08); } }
        @media (prefers-color-scheme: dark) {
            body { background:#080b14; color:#edf1ff; }
            body:before { background:#241d4d; } body:after { background:#123f49; }
            .login-container { border-color:rgba(255,255,255,.09); background:rgba(20,25,42,.82); box-shadow:0 24px 80px rgba(0,0,0,.38); }
            .auth-form label { color:#aeb9d4; }
            .auth-form input { color:#edf1ff; border-color:rgba(170,184,220,.2); background:rgba(10,14,27,.72); }
            .auth-form input::placeholder { color:#77839f; }
            .auth-switch { color:#98a5c0; } .providers { color:#9aa6c0; }
            .providers span { border-color:rgba(170,184,220,.18); background:rgba(255,255,255,.05); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo"><img src="{{ url_for('static', filename='neo-logo.webp') }}" alt="Neo logosu"></div>
        <h1>Neo'ya hoş geldin</h1>
        <div class="auth-panel active" id="loginPanel">
            <form class="auth-form" method="post" action="{{ url_for('email_login') }}">
                <label for="loginEmail">E-posta</label>
                <input id="loginEmail" name="email" type="email" autocomplete="email" required placeholder="sen@ornek.com">
                <label for="loginPassword">Şifre</label>
                <input id="loginPassword" name="password" type="password" minlength="8" autocomplete="current-password" required placeholder="En az 8 karakter">
                <button class="auth-submit" type="submit">E-posta ile giriş yap →</button>
            </form>
            <div class="auth-switch">Hesabın yok mu? <button type="button" onclick="showRegister()">Hesap oluştur</button></div>
        </div>
        <div class="auth-panel" id="registerPanel">
            <form class="auth-form" method="post" action="{{ url_for('email_register') }}">
                <label for="registerEmail">E-posta</label>
                <input id="registerEmail" name="email" type="email" autocomplete="email" required placeholder="sen@ornek.com">
                <label for="registerPassword">Şifre</label>
                <input id="registerPassword" name="password" type="password" minlength="8" autocomplete="new-password" required placeholder="En az 8 karakter">
                <button class="auth-submit" type="submit">Ücretsiz hesap oluştur</button>
            </form>
            <div class="auth-switch">Zaten hesabın var mı? <button type="button" onclick="showLogin()">Giriş yap</button></div>
        </div>
        {% if hata %}<div class="error">{{ hata }}</div>{% endif %}
        <div class="providers"><span>Neo hesabı</span></div>
    </div>
    <script>
        function showRegister(){document.getElementById('loginPanel').classList.remove('active');document.getElementById('registerPanel').classList.add('active');}
        function showLogin(){document.getElementById('registerPanel').classList.remove('active');document.getElementById('loginPanel').classList.add('active');}
    </script>
</body>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/neo-sw.js").catch(() => {}));
}
</script>
</html>
