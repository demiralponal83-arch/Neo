<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>NICO Sohbet Robotu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1a26;
            color: #e6e6e6;
            margin: 0;
            padding: 50px;
            text-align: center;
        }
        .container {
            background-color: #1a2c3d;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            margin: 0 auto;
            text-align: left;
        }
        h1 {
            color: #4CAF50;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
            margin-bottom: 30px;
            text-transform: uppercase;
            text-align: center;
        }
        .chat-box {
            min-height: 150px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #324a61;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            background-color: #0d1a26;
        }
        .user-message {
            background-color: #00bcd4;
            color: #0d1a26;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: right;
            margin-left: 20%;
        }
        .nico-message {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: left;
            margin-right: 20%;
        }
        form {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            border: 2px solid #324a61;
            border-radius: 8px;
            background-color: #0d1a26;
            color: #e6e6e6;
            font-size: 16px;
        }
        button[type="submit"] {
            background-color: #4CAF50;
            color: #1a2c3d;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button[type="submit"]:hover {
            background-color: #388e3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 NICO ile Sohbet</h1>

        <div class="chat-box">
            {% if cevap %}
                <div class="user-message">
                    <strong>Siz:</strong> {{ sorgu }}
                </div>
                <div class="nico-message">
                    <strong>NICO:</strong> {{ cevap | safe }}
                </div>
            {% else %}
                <div class="nico-message">
                    Merhaba! Ben NICO, size nasıl yardımcı olabilirim?
                </div>
            {% endif %}
        </div>

        <form action="/sohbet" method="POST">
            <input type="text" id="sorgu" name="sorgu" placeholder="Sorunuzu buraya yazın..." required>
            <button type="submit">
                Gönder
            </button>
        </form>
    </div>
</body>
</html>
