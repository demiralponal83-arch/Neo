<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo geliştiriliyor</title>
    <link rel="preload" href="{{ url_for('static', filename='neo-logo.webp') }}" as="image" type="image/webp">
    <link rel="icon" href="{{ url_for('static', filename='neo-logo.webp') }}" type="image/webp">
    <style>
        :root { --ink:#17213a; --muted:#7b86a1; }
        * { box-sizing:border-box; }
        body {
            min-height:100vh; margin:0; display:grid; place-items:center; overflow:hidden;
            padding:24px; color:var(--ink); font-family:Inter,"Segoe UI",sans-serif;
            background:#eef1fb;
        }
        body::before, body::after {
            content:""; position:fixed; z-index:-1; width:390px; height:390px;
            border-radius:50%; filter:blur(5px); opacity:.72;
            animation:drift 12s ease-in-out infinite alternate;
        }
        body::before { left:-130px; top:-150px; background:#d8ceff; }
        body::after { right:-120px; bottom:-150px; background:#bceff4; animation-delay:-5s; }
        main {
            width:min(94vw,520px); padding:48px 38px 42px; text-align:center;
            border:1px solid rgba(255,255,255,.9); border-radius:32px;
            background:rgba(255,255,255,.76); backdrop-filter:blur(24px);
            box-shadow:0 24px 80px rgba(72,83,130,.16);
            animation:rise .7s cubic-bezier(.2,.8,.2,1);
        }
        .logo {
            width:86px; height:86px; margin:0 auto 24px; overflow:hidden;
            border-radius:28px; background:#31445e;
            box-shadow:0 16px 32px rgba(117,87,245,.25);
            animation:float 4s ease-in-out infinite;
        }
        .logo img { width:100%; height:100%; object-fit:cover; }
        .eyebrow {
            margin-bottom:12px; color:#7658f6; font-size:11px; font-weight:800;
            letter-spacing:.16em; text-transform:uppercase;
        }
        h1 { margin:0; font-size:clamp(27px,5vw,38px); letter-spacing:-.06em; }
        p { max-width:390px; margin:15px auto 0; color:var(--muted); line-height:1.65; font-size:14px; }
        .status {
            display:inline-flex; align-items:center; gap:8px; margin-top:27px;
            padding:10px 14px; border:1px solid rgba(130,145,190,.18);
            border-radius:999px; color:#65728e; background:rgba(255,255,255,.55);
            font-size:12px; font-weight:700;
        }
        .dot { width:8px; height:8px; border-radius:50%; background:#7658f6; box-shadow:0 0 0 5px rgba(118,88,246,.12); animation:pulse 1.8s infinite; }
        @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
        @keyframes float { 0%,100% { transform:translateY(0) rotate(-2deg); } 50% { transform:translateY(-7px) rotate(2deg); } }
        @keyframes drift { from { transform:translate(0,0) scale(1); } to { transform:translate(30px,24px) scale(1.08); } }
        @keyframes pulse { 50% { opacity:.45; transform:scale(.8); } }
         /* Resmi, sade bakım teması */
         body::before, body::after { display:none; }
         body { background:#f4f6f8; }
         main { border-color:#dfe4ea; border-radius:16px; background:#fff; backdrop-filter:none; box-shadow:0 10px 30px rgba(31,45,61,.08); animation:none; }
         .logo { box-shadow:none; border-radius:14px; animation:none; }
         .eyebrow { color:#52677d; }
         .status { border-color:#dfe4ea; border-radius:10px; background:#f4f6f8; }
         .dot { background:#60758c; box-shadow:none; animation:none; }
         @media (prefers-color-scheme: dark) {
            body { background:#080b14; color:var(--ink); }
             body::before, body::after { display:none; }
             main { border-color:#36414d; background:#202731; box-shadow:0 10px 30px rgba(0,0,0,.25); }
             p { color:#9ba8c3; } .status { color:#aeb9d4; border-color:#3b4754; background:#2a333e; }
        }
    </style>
</head>
<body>
    <main>
        <div class="logo"><img src="{{ url_for('static', filename='neo-logo.webp') }}" alt="Neo logosu"></div>
        <div class="eyebrow">Kısa bir ara</div>
        <h1>Neo geliştiriliyor</h1>
        <p>Neo şu anda daha iyi, daha hızlı ve daha güzel olması için geliştiriliyor. Çok yakında yeniden burada olacağız.</p>
        <div class="status"><span class="dot"></span>Geliştirme devam ediyor</div>
    </main>
</body>
</html>
