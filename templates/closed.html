<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Hesap kapatıldı — Neo</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,"Segoe UI",sans-serif;color:#17213a;background:#eef1fb}main{width:min(94vw,500px);padding:42px 34px;text-align:center;border-radius:30px;background:rgba(255,255,255,.8);box-shadow:0 24px 80px rgba(72,83,130,.16)}.logo{width:64px;height:64px;margin:0 auto 22px;border-radius:21px;overflow:hidden;background:#31445e}.logo img{width:100%;height:100%;object-fit:cover}h1{margin:0;font-size:26px;letter-spacing:-.05em}p{margin:13px 0 24px;color:#7b86a1;line-height:1.6;font-size:14px}a{display:inline-block;padding:12px 18px;border-radius:13px;color:#fff;background:#202b49;text-decoration:none;font-weight:800;font-size:13px}@media(prefers-color-scheme:dark){body{color:#edf1ff;background:#080b14}main{background:rgba(20,25,42,.86)}p{color:#9ba8c3}a{background:#edf1ff;color:#101525}}
      /* Resmi, sade hesap durumu teması */
      body{background:#f4f6f8}main{border:1px solid #dfe4ea;border-radius:16px;background:#fff;box-shadow:0 10px 30px rgba(31,45,61,.08)}.logo{border-radius:14px;box-shadow:none}a{border-radius:9px;background:#34465b}
      @media(prefers-color-scheme:dark){body{background:#151a20}main{border-color:#36414d;background:#202731;box-shadow:0 10px 30px rgba(0,0,0,.25)}p{color:#9ba8c3}a{background:#60758c}}
      .test-toolbar{position:fixed;z-index:80;right:18px;bottom:18px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;max-width:min(92vw,560px);padding:10px 12px;border:1px solid rgba(255,255,255,.7);border-radius:18px;background:rgba(255,255,255,.72);box-shadow:0 14px 35px rgba(31,45,61,.18);backdrop-filter:blur(22px) saturate(130%);font-size:11px}.test-toolbar strong{color:#34465b}.test-toolbar button,.test-toolbar a{padding:8px 9px;border:1px solid #d5dce4;border-radius:9px;color:#52677d;background:rgba(255,255,255,.65);cursor:pointer;text-decoration:none;font:inherit;font-weight:700}@media(max-width:600px){.test-toolbar{right:10px;bottom:10px;left:10px;max-width:none}}@media(prefers-color-scheme:dark){.test-toolbar{border-color:#465361;background:rgba(32,39,49,.82)}.test-toolbar strong{color:#edf1f5}.test-toolbar button,.test-toolbar a{border-color:#4a5866;color:#d6dee7;background:rgba(96,117,140,.2)}}
    </style>
</head>
<body>{% if session.get('admin_test_mode') %}<div class="test-toolbar"><strong>Test hesabı</strong><form method="post" action="/yonetim/kullanici/neo-test-account/askiya-al" onsubmit="return confirm('Test hesabını askıya almak istediğine emin misin?')"><button type="submit">Askıya al</button></form><form method="post" action="/yonetim/kullanici/neo-test-account/kapat" onsubmit="return confirm('Test hesabını kapatmak istediğine emin misin?')"><button type="submit">Tamamen kapat</button></form><form method="post" action="/yonetim/kullanici/neo-test-account/kapatmayi-geri-al" onsubmit="return confirm('Test hesabını yeniden açmak istediğine emin misin?')"><button type="submit">Geri aç</button></form><button type="button" onclick="changeTestPassword()">Şifre değiştir</button><a href="/yonetim/testten-cik">Testten çık</a></div><script>async function changeTestPassword(){const p=prompt('Yeni şifre (en az 8 karakter):');if(!p||p.length<8)return;await fetch('/yonetim/kullanici/neo-test-account/sifre-degistir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});}</script>{% endif %}<main><div class="logo"><img src="{{ profile_image_url or url_for('static', filename='neo-logo.webp') }}" alt="{{ user_name }} profil fotoğrafı"></div><h1>Hesabınız kapatıldı ({{ user_name }})</h1><p>Bu hesap yönetici tarafından tamamen kapatıldı. Hesabın yeniden açılması için yöneticiyle iletişime geçebilirsin.</p><a href="/cikis">Güvenli çıkış yap</a></main></body>
</html>
