<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nico - Kisisel Asistan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            padding: 20px;
            gap: 20px;
        }
        /* Sol taraf - Sohbet */
        .chat-container {
            flex: 1;
            max-width: 600px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        .chat-header {
            background: white;
            color: black;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }
        .chat-header h1 { font-size: 1.5em; margin-bottom: 5px; }
        .chat-header p { font-size: 0.9em; opacity: 0.7; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }
        .message {
            margin-bottom: 15px;
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
        }
        .message.user {
            background: black;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .chat-input {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
        }
        .chat-input input:focus { border-color: black; }
        .chat-input button {
            margin-left: 10px;
            padding: 12px 20px;
            background: black;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
        }
        .chat-input button:hover { background: #333; }
        /* Sag taraf - Sohbet gecmisi */
        .history-container {
            width: 350px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        .history-header {
            background: white;
            color: black;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }
        .history-header h2 { font-size: 1.2em; }
        .new-chat-btn {
            background: black;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            margin: 10px 20px;
            font-size: 0.9em;
        }
        .new-chat-btn:hover { background: #333; }
        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #fafafa;
        }
        .history-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .history-item:hover {
            border-color: black;
        }
        .history-item .konu {
            font-weight: bold;
            color: black;
            margin-bottom: 5px;
            font-size: 1em;
        }
        .history-item .zaman {
            color: #666;
            font-size: 0.8em;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }
        .user-info {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 20px;
            font-size: 0.85em;
            text-align: center;
        }
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .history-container { width: 100%; height: 40vh; }
            .chat-container { max-width: 100%; height: 50vh; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Nico</h1>
            <p>Kisisel Asistanin</p>
        </div>
        <div class="chat-messages" id="messages">
            <div class="message assistant">
                Merhaba! Ben Nico. Size nasil yardimci olabilirim?
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Bir seyler yaz...">
            <button onclick="sendMessage()">Gonder</button>
        </div>
    </div>

    <div class="history-container">
        <div class="history-header">
            <h2>Sohbet Gecmisi</h2>
        </div>
        <div class="user-info" id="userInfo">
            Kullanici: <span id="userName">Bilinmiyor</span>
        </div>
        <button class="new-chat-btn" onclick="yeniSohbet()">+ Yeni Sohbet</button>
        <div class="history-list" id="historyList">
            <div class="history-empty">
                Henuz sohbet gecmisi yok.
            </div>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const historyList = document.getElementById('historyList');
        const userNameSpan = document.getElementById('userName');

        function getUserId() {
            let userId = localStorage.getItem('nico_user_id');
            if (!userId) {
                userId = 'user_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('nico_user_id', userId);
            }
            return userId;
        }

        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/sohbetler', {
                    headers: { 'X-User-ID': getUserId() }
                });
                const sohbetler = await response.json();
                
                if (sohbetler.length === 0) {
                    historyList.innerHTML = '<div class="history-empty">Henuz sohbet gecmisi yok.</div>';
                    return;
                }

                historyList.innerHTML = '';
                sohbetler.forEach(s => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    item.onclick = () => sohbetYukle(s.id);
                    item.innerHTML = `
                        <div class="konu">${s.konu}</div>
                        <div class="zaman">${s.zaman}</div>
                    `;
                    historyList.appendChild(item);
                });
            } catch (error) {
                console.error('Gecmis yuklenirken hata:', error);
            }
        }

        async function sohbetYukle(sohbetId) {
            try {
                const response = await fetch('/api/sohbet/' + sohbetId, {
                    headers: { 'X-User-ID': getUserId() }
                });
                const mesajlar = await response.json();
                
                messagesDiv.innerHTML = '';
                mesajlar.forEach(m => {
                    addMessage(m.mesaj, m.gonderen === 'kullanici' ? 'user' : 'assistant');
                });
            } catch (error) {
                console.error('Sohbet yuklenirken hata:', error);
            }
        }

        async function yeniSohbet() {
            try {
                const response = await fetch('/api/yeni-sohbet', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-User-ID': getUserId()
                    },
                    body: JSON.stringify({ konu: 'Yeni Sohbet' })
                });
                const data = await response.json();
                
                messagesDiv.innerHTML = '<div class="message assistant">Yeni sohbet basladi! Size nasil yardimci olabilirim?</div>';
                loadHistory();
            } catch (error) {
                console.error('Yeni sohbet olusturulurken hata:', error);
            }
        }

        async function loadUserInfo() {
            try {
                const response = await fetch('/api/kullanici', {
                    headers: { 'X-User-ID': getUserId() }
                });
                const data = await response.json();
                if (data.isim) {
                    userNameSpan.textContent = data.isim;
                }
            } catch (error) {
                console.error('Kullanici bilgisi yuklenirken hata:', error);
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            
            addMessage(text, 'user');
            userInput.value = '';
            
            try {
                const response = await fetch('/api/cevap', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-User-ID': getUserId()
                    },
                    body: JSON.stringify({ mesaj: text })
                });
                const data = await response.json();
                addMessage(data.cevap, 'assistant');
                loadHistory();
                loadUserInfo();
            } catch (error) {
                addMessage('Bir hata olustu, tekrar dene.', 'assistant');
            }
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        loadHistory();
        loadUserInfo();
    </script>
</body>
</html>
